apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: guestbook-microservices-dev
  namespace: kargo-simple
  annotations:
    kargo.akuity.io/color: green
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/asaunders-toptal/kargo-quickstart-template
      - name: guestbookImage
        value: ghcr.io/asaunders-toptal/guestbook
      - name: backendImage
        value: ghcr.io/asaunders-toptal/backend
      - name: queueImage
        value: ghcr.io/asaunders-toptal/queue
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./src
          - branch: env/dev
            create: true
            path: ./out
      - uses: git-clear
        config:
          path: ./out
      - uses: kustomize-set-image
        as: update-image-guestbook
        config:
          path: ./src/app/guestbook/env/dev
          images:
          - image: ${{ vars.guestbookImage }}
            tag: ${{ imageFrom(vars.guestbookImage).Tag }}
      - uses: kustomize-set-image
        as: update-image-backend
        config:
          path: ./src/app/backend/env/dev
          images:
          - image: ${{ vars.backendImage }}
            tag: ${{ imageFrom(vars.backendImage).Tag }}
      - uses: kustomize-set-image
        as: update-image-queue
        config:
          path: ./src/app/queue/env/dev
          images:
          - image: ${{ vars.queueImage }}
            tag: ${{ imageFrom(vars.queueImage).Tag }}
      - uses: kustomize-build
        config:
          path: ./src/app/guestbook/env/dev
          outPath: ./out/guestbook-manifests.yaml
      - uses: kustomize-build
        config:
          path: ./src/app/backend/env/dev
          outPath: ./out/backend-manifests.yaml
      - uses: kustomize-build
        config:
          path: ./src/app/queue/env/dev
          outPath: ./out/queue-manifests.yaml
      - uses: git-commit
        as: commit
        config:
          path: ./out
          message: "Update images for guestbook, backend, and queue dev"
      - uses: git-push
        config:
          path: ./out
          targetBranch: env/dev
      - uses: argocd-update
        config:
          apps:
          - name: guestbook-simple-dev
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs.commit.commit }}
      - uses: argocd-update
        config:
          apps:
          - name: backend-dev
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs.commit.commit }}
      - uses: argocd-update
        config:
          apps:
          - name: queue-dev
            sources:
            - repoURL: ${{ vars.gitRepo }}
              desiredRevision: ${{ outputs.commit.commit }}
---
